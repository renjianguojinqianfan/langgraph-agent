<!doctype html>
<!-- PROTOTYPE ONLY (throwaway): 「安静的监控台」 quiet-console direction.
     Double-click to open. No build, no server. Data is mock. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原型 · 安静的监控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0B;
    --panel: #131316;
    --raised: #17171B;
    --line: rgba(255, 255, 255, 0.06);
    --line-strong: rgba(255, 255, 255, 0.11);
    --ink: #E8E8EA;
    --dim: #9BA0A6;
    --mute: #63676D;
    --accent: #4C8DFF;
    --ok: #3FB97F;
    --danger: #E5534B;
    --warn: #D9A441;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

  .app { display: flex; height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    width: 250px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--bg);
  }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
  .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .logo svg { width: 12px; height: 12px; }
  .side-title { font-weight: 600; font-size: 13.5px; }
  .icon-btn { margin-left: auto; color: var(--mute); padding: 4px; border-radius: 6px; transition: color .15s; }
  .icon-btn:hover { color: var(--ink); }
  .new-btn {
    margin: 2px 12px 10px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 9px;
    color: var(--dim); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color .15s, border-color .15s;
  }
  .new-btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }
  .search {
    margin: 0 12px 8px; padding: 7px 10px; background: var(--raised); border: 1px solid var(--line);
    border-radius: 8px; color: var(--mute); font-size: 12.5px; display: flex; gap: 7px; align-items: center;
  }
  .task-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .task-item { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; transition: background .15s; display: block; }
  .task-item:hover { background: rgba(255,255,255,0.035); }
  .task-item.cur { background: var(--raised); }
  .task-item .t { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-item .m { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--mute); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot.run { background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--danger); }
  .dot.halt { background: var(--warn); }
  .dot.que { background: var(--mute); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .side-foot { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12.5px; display: flex; gap: 7px; align-items: center; }

  /* ---------- main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .head {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
  }
  .head h1 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .head .st { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .head .spacer { flex: 1; min-width: 8px; }
  .ghost-btn {
    padding: 5px 11px; border-radius: 7px; font-size: 12.5px; color: var(--dim);
    border: 1px solid var(--line-strong); transition: color .15s, border-color .15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .ghost-btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }
  .ghost-btn.danger { color: var(--danger); border-color: rgba(229,83,75,0.35); }
  .ghost-btn.danger:hover { background: rgba(229,83,75,0.08); border-color: rgba(229,83,75,0.6); }

  .flow { flex: 1; overflow-y: auto; }
  .flow-inner { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }
  .block + .block { margin-top: 18px; }

  /* user request */
  .req {
    background: var(--raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; color: var(--ink);
  }
  .req .who { font-size: 11px; color: var(--mute); margin-bottom: 4px; }

  /* collapsible generic */
  .col { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .col-head {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 14px;
    font-size: 13px; color: var(--dim); text-align: left; transition: background .15s;
  }
  .col-head:hover { background: rgba(255,255,255,0.025); }
  .col-head .chev { transition: transform .18s; color: var(--mute); flex-shrink: 0; }
  .col.open .col-head .chev { transform: rotate(90deg); }
  .col-body { display: none; border-top: 1px solid var(--line); padding: 12px 14px; }
  .col.open .col-body { display: block; }

  /* plan */
  .plan-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 13.5px; }
  .plan-row .n { font-family: var(--mono); font-size: 11.5px; color: var(--mute); width: 18px; text-align: right; }
  .plan-row.done .d { color: var(--mute); }
  .plan-row.active .d { color: var(--ink); }
  .plan-row .tag { margin-left: auto; font-size: 11px; color: var(--mute); }
  .plan-row.active .tag { color: var(--accent); }

  /* steps */
  .step { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .step + .step { margin-top: 8px; }
  .step-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px; text-align: left;
    transition: background .15s;
  }
  .step-head:hover { background: rgba(255,255,255,0.025); }
  .step-head .sum { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step-head .meta { font-size: 11.5px; color: var(--mute); flex-shrink: 0; font-family: var(--mono); }
  .step-body { display: none; border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .step.open .step-body { display: block; }
  .step-head .chev { transition: transform .18s; color: var(--mute); flex-shrink: 0; }
  .step.open .step-head .chev { transform: rotate(90deg); }
  .step.running { border-color: rgba(76,141,255,0.28); }
  .tool { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 12px; padding: 3px 0; }
  .tool .name { color: var(--ink); }
  .tool .st-txt { margin-left: auto; font-size: 11px; }
  .st-ok { color: var(--ok); }
  .st-err { color: var(--danger); }
  .st-skip { color: var(--warn); }
  .st-dim { color: var(--mute); }
  .kv { font-family: var(--mono); font-size: 11px; color: var(--dim); background: var(--bg);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px;
         white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }

  /* marker note */
  .note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--mute); padding: 2px 4px; }
  .note svg { flex-shrink: 0; }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--danger); }

  /* markdown answer */
  .md h2 { font-size: 17px; font-weight: 600; margin: 14px 0 6px; }
  .md h3 { font-size: 14.5px; font-weight: 600; margin: 12px 0 4px; }
  .md p { margin: 6px 0; color: #C9CDD3; }
  .md ul, .md ol { margin: 6px 0 6px 20px; color: #C9CDD3; display: grid; gap: 3px; }
  .md code { font-family: var(--mono); font-size: 0.85em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--accent); }
  .md strong { color: var(--ink); font-weight: 600; }
  .codeblock { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .codeblock .cb-head { display: flex; align-items: center; padding: 6px 12px; background: var(--raised); border-bottom: 1px solid var(--line); }
  .codeblock .lang { font-family: var(--mono); font-size: 11px; color: var(--mute); }
  .codeblock .copy { margin-left: auto; font-size: 11.5px; color: var(--dim); display: flex; gap: 5px; align-items: center; transition: color .15s; }
  .codeblock .copy:hover { color: var(--ink); }
  .codeblock pre { padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: var(--dim); overflow-x: auto; }

  /* artifacts */
  .art-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .art-row .f { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  .art-row .s { font-size: 11px; color: var(--mute); }
  .art-row .a { margin-left: auto; display: flex; gap: 14px; }
  .art-row .a span { font-size: 12.5px; color: var(--dim); cursor: pointer; transition: color .15s; }
  .art-row .a span:hover { color: var(--accent); }

  .sec-label { font-size: 11px; color: var(--mute); letter-spacing: 0.06em; margin-bottom: 8px; }

  /* composer */
  .composer { flex-shrink: 0; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--bg); }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .composer-card { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 16px; padding: 12px 14px 8px; }
  .composer-card .ph { color: var(--mute); font-size: 14px; min-height: 44px; }
  .composer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .composer-row .hint { font-size: 11px; color: var(--mute); margin-left: 6px; }
  .composer-row .grow { flex: 1; }
  .model-chip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); padding: 5px 10px; border-radius: 8px; transition: background .15s; }
  .model-chip:hover { background: rgba(255,255,255,0.05); }
  .send-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; transition: opacity .15s; }
  .send-btn:hover { opacity: 0.85; }

  /* ---------- right drawer ---------- */
  .drawer {
    width: 0; flex-shrink: 0; overflow: hidden; border-left: 1px solid transparent;
    transition: width .2s ease, border-color .2s;
    background: var(--bg); display: flex; flex-direction: column;
  }
  .drawer.open { width: 340px; border-color: var(--line); }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); min-width: 340px; }
  .drawer-tabs { display: flex; gap: 2px; }
  .drawer-tabs button { font-size: 12.5px; color: var(--mute); padding: 5px 10px; border-radius: 7px; }
  .drawer-tabs button.cur { color: var(--ink); background: var(--raised); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 14px; min-width: 340px; }
  .ev-row { display: flex; gap: 10px; font-family: var(--mono); font-size: 11.5px; padding: 4px 0; color: var(--dim); }
  .ev-row .ts { color: var(--mute); flex-shrink: 0; }

  /* file tree */
  .tree-row { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
              padding: 3px 6px; border-radius: 6px; transition: background .15s; }
  .tree-row:hover { background: rgba(255,255,255,0.035); }
  .tree-row .chev { color: var(--mute); flex-shrink: 0; transition: transform .15s; }
  .tree-row.open .chev { transform: rotate(90deg); }
  .tree-row .fname { font-family: var(--mono); font-size: 12px; color: var(--dim); flex: 1;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-row.dir .fname { color: var(--ink); }
  .tree-row .fsize { font-size: 10.5px; color: var(--mute); flex-shrink: 0; }
  .tree-row .fresh { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .tree-kids { margin-left: 11px; border-left: 1px solid var(--line); padding-left: 6px; }

  /* preview column (4th column) */
  .preview { width: 0; flex-shrink: 0; overflow: hidden; border-left: 1px solid transparent;
             transition: width .2s ease, border-color .2s; background: var(--bg);
             display: flex; flex-direction: column; }
  .preview.open { width: 460px; border-color: var(--line); }
  .pv-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
             border-bottom: 1px solid var(--line); min-width: 460px; }
  .pv-path { font-family: var(--mono); font-size: 11.5px; color: var(--dim);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-body { flex: 1; overflow-y: auto; padding: 16px 18px; min-width: 460px; }
  .pv-body pre.raw { font-family: var(--mono); font-size: 11.5px; color: var(--dim);
                     white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

  /* ---------- confirm dialog ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 50; }
  .overlay.show { display: flex; }
  .dialog { width: 440px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 20px; }
  .dialog h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dialog p { font-size: 13.5px; color: #C9CDD3; margin-top: 10px; }
  .dialog .mono { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
  .dialog details { margin-top: 10px; }
  .dialog summary { font-size: 12px; color: var(--mute); cursor: pointer; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn-ghost { padding: 7px 14px; border-radius: 8px; font-size: 13px; color: var(--dim); border: 1px solid var(--line-strong); transition: color .15s; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-accent { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--accent); color: #fff; transition: opacity .15s; }
  .btn-accent:hover { opacity: 0.85; }

  @media (prefers-reduced-motion: reduce) {
    .dot.run { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <aside class="side">
    <div class="side-head">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
      <span class="side-title">LangGraph Agent</span>
      <button class="icon-btn" aria-label="收起侧栏"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </div>
    <button class="new-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 新任务</button>
    <div class="search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> 搜索任务…</div>
    <div class="task-list" id="taskList"></div>
    <div class="side-foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg> 设置</div>
  </aside>

  <!-- main -->
  <div class="main">
    <div class="head" id="head"></div>
    <div class="flow"><div class="flow-inner" id="flow"></div></div>
    <div class="composer"><div class="composer-inner">
      <div class="composer-card">
        <div class="ph">用自然语言描述一个任务，例如：联网查资料并写一份报告…</div>
        <div class="composer-row">
          <button class="icon-btn" style="margin:0" aria-label="附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="hint">Ctrl/⌘ + Enter 发送</span>
          <span class="grow"></span>
          <button class="model-chip">qwen3.7-flash <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="send-btn" aria-label="发送"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- preview column (4th column: opens when a file is selected) -->
  <div class="preview" id="preview">
    <div class="pv-head">
      <span class="pv-path" id="pvPath"></span>
      <span style="flex:1"></span>
      <button class="ghost-btn" style="padding:4px 9px;font-size:12px">下载</button>
      <button class="icon-btn" id="pvClose" aria-label="关闭预览"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="pv-body" id="pvBody"></div>
  </div>

  <!-- right drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-tabs">
        <button class="cur" data-tab="files">文件</button>
        <button data-tab="detail">步骤</button>
        <button data-tab="events">事件</button>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="关闭面板"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<!-- confirm dialog -->
<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg> 需要人工确认</h2>
    <p>工具 <span class="mono">write_file</span> 要在工作区覆写文件 <span class="mono">langgraph-selection-report.md</span>（约 2 KB）。允许它执行吗？</p>
    <details>
      <summary>查看入参</summary>
      <div class="kv">{ "path": "langgraph-selection-report.md",
  "content": "# LangGraph 1.x 选型报告\n\n(骨架)…" }</div>
    </details>
    <div class="actions">
      <button class="btn-ghost" data-close>拒绝</button>
      <button class="btn-accent" data-close>允许执行</button>
    </div>
  </div>
</div>

<script>
/* ---------------- mock data ---------------- */
const TASKS = [
  {

/* ---------------- tiny markdown ---------------- */
function inlineMd(t) {
  return t
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function renderMd(src) {
  const lines = src.split("\n");
  let html = "", inList = null;
  const closeList = () => { if (inList) { html += inList === "ul" ? "</ul>" : "</ol>"; inList = null; } };
  for (const line of lines) {
    if (line.startsWith("### ")) { closeList(); html += "<h3>" + inlineMd(line.slice(4)) + "</h3>"; continue; }
    if (line.startsWith("## ")) { closeList(); html += "<h2>" + inlineMd(line.slice(3)) + "</h2>"; continue; }
    if (line.startsWith("- ")) { if (inList !== "ul") { closeList(); html += "<ul>"; inList = "ul"; } html += "<li>" + inlineMd(line.slice(2)) + "</li>"; continue; }
    const m = line.match(/^(\d+)\.\s+(.*)$/);
    if (m) { if (inList !== "ol") { closeList(); html += "<ol>"; inList = "ol"; } html += "<li>" + inlineMd(m[2]) + "</li>"; continue; }
    closeList();
    if (line.trim()) html += "<p>" + inlineMd(line) + "</p>";
  }
  closeList();
  return '<div class="md">' + html + "</div>";
}

/* ---------------- render ---------------- */
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

      '<div class="t">' + esc(t.title) + '</div>' +
      '<div class="m"><span class="dot ' + st.cls + '"></span>' + st.word + '<span>·</span>' + t.ago + '</div>' +
      '</button>';
  }).join("");
}

function renderHead(t) {
  const st = ST[t.status];
  const settled = t.status !== "RUNNING";
  $("#head").innerHTML =
    '<h1>' + esc(t.title) + '</h1>' +
    '<span class="st"><span class="dot ' + st.cls + '"></span>' + st.word + '</span>' +
    '<span class="spacer"></span>' +
    '<button class="ghost-btn" id="gateBtn">模拟确认弹窗</button>' +
    (settled ? '<button class="ghost-btn">回滚</button>' : '<button class="ghost-btn danger">停止</button>') +
    '<button class="icon-btn" id="drawerBtn" aria-label="详情面板"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>';
}

function toolHtml(tc) {
  const cls = tc.st === "ok" ? "st-ok" : tc.st === "err" ? "st-err" : tc.st === "skip" ? "st-skip" : "st-dim";
  return '<div class="tool"><span class="name">' + tc.n + '</span><span class="st-txt ' + cls + '">' + tc.note + '</span></div>' +
    '<div class="kv">入参 ' + esc(tc.in) + '\n出参 ' + esc(tc.out) + '</div>';
}

function renderFlow(t) {
  const toolCount = t.steps.reduce((n, s) => n + s.tools.length, 0);
  let h = "";

  h += '<div class="block"><div class="req"><div class="who">你的指令</div>' + esc(t.input) + '</div></div>';

  if (t.plan.length) {
    h += '<div class="block"><div class="col' + (t.status === "RUNNING" ? "" : " open") + '" data-col>' +
      '<button class="col-head"><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>规划 · ' + t.plan.length + ' 项</button>' +
      '<div class="col-body">' +
      t.plan.map((p, i) =>
        '<div class="plan-row ' + p.s + '"><span class="n">' + (i + 1) + '</span><span class="d">' + esc(p.d) + '</span><span class="tag">' +
        (p.s === "done" ? "已完成" : p.s === "active" ? "进行中" : "") + '</span></div>'
      ).join("") +
      '</div></div></div>';
  }

  h += '<div class="block"><div class="sec-label">执行过程 · ' + t.steps.length + ' 步 · ' + toolCount + ' 次工具调用</div>';
  t.steps.forEach((s) => {
    const dotCls = s.s === "running" ? "run" : s.s === "done" ? "ok" : "que";
    const meta = s.tools.length ? s.tools.length + " 个工具" : (s.s === "pending" ? "待执行" : "无工具");
    const open = s.s === "running" || s.i === selectedStep;
    h += '<div class="step' + (s.s === "running" ? " running" : "") + (open ? " open" : "") + '" data-step="' + s.i + '">' +
      '<button class="step-head"><span class="dot ' + dotCls + '"></span><span class="sum">' +
      (s.thought ? esc(s.thought) : "（等待执行）") + '</span><span class="meta">' + meta + '</span>' +
      '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>' +
      '<div class="step-body">' + (s.tools.length ? s.tools.map(toolHtml).join("") : '<div style="font-size:12px;color:var(--mute)">本步骤未调用工具。</div>') +
      (s.note ? '<div class="note ' + s.note.kind + '" style="margin-top:8px">' + esc(s.note.text) + '</div>' : "") +
      '</div></div>';
  });
  h += "</div>";

  if (t.error) h += '<div class="block"><div class="note err" style="padding:10px 14px;border:1px solid rgba(229,83,75,.3);border-radius:10px">' + esc(t.error) + '</div></div>';

  if (t.answer) h += '<div class="block"><div class="sec-label">最终回答</div>' + renderMd(t.answer) + "</div>";

  if (t.artifacts.length) {
    h += '<div class="block"><div class="sec-label">产物文件</div>' +
      t.artifacts.map((a) =>
        '<div class="art-row"><span class="f">' + esc(a.f) + '</span><span class="s">' + a.s + '</span><span class="a"><span class="art-pv" data-pv="' + esc(a.f) + '">预览</span><span>下载</span></span></div>'
      ).join("") + "</div>";
  }

  $("#flow").innerHTML = h;
}

function treeHtml(nodes, path) {
  return nodes.map((n) => {
    const p = path ? path + "/" + n.n : n.n;
    if (n.type === "dir") {
      const open = treeOpen.has(p);
      return '<button class="tree-row dir' + (open ? " open" : "") + '" data-dir="' + p + '">' +
        '<svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>' +
        '<span class="fname">' + n.n + '/</span></button>' +
        (open ? '<div class="tree-kids">' + treeHtml(n.kids || [], p) + '</div>' : "");
    }
    return '<button class="tree-row" data-file="' + p + '">' +
      '<span style="width:10px;flex-shrink:0"></span>' +
      '<span class="fname"' + (p === previewFile ? ' style="color:var(--accent)"' : "") + '>' + n.n + '</span>' +
      (n.fresh ? '<span class="fresh" title="本任务产物"></span>' : "") +
      '<span class="fsize">' + n.s + '</span></button>';
  }).join("");
}

}
