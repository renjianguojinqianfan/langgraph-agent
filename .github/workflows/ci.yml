# ─────────────────────────────────────────────────────────────────────────────
# CI workflow for langgraph-agent
#
# 触发：push / PR 到 master（docs/ 与 *.md 变更不触发）；workflow_dispatch 手动
# 内容：
#   backend-test    Python 3.11 + pytest 离线全量回归（backend/tests/，331 用例）
#   frontend-build  npm ci + tsc 类型检查 + vite 生产构建（产物上传为 artifact）
#   docker-build    验证 backend/Dockerfile 可构建（不 push）
#   live-e2e        真实 LLM 端到端验证（可选，需配置 LLM_API_KEY secret，默认仅手动触发）
#
# 硬约束遵循 AGENTS.md：
#   - mcp 依赖用 --no-deps 单独安装，避免升级 uvicorn/starlette
#   - 离线测试由 backend/tests/conftest.py 顶部环境变量隔离，无需 .env
#   - LLM key 只走 secrets 注入，绝不硬编码/打印
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: "运行真实 LLM 端到端验证（需配置 LLM_API_KEY secret）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 后端：离线全量回归 ────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # mcp 必须 --no-deps 安装，防止其拉高 uvicorn/starlette 版本（AGENTS.md 硬约束）
          grep -vE '^mcp' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      - name: Run offline test suite
        run: |
          python -m pytest backend/tests/ -q --durations=10 \
            --junitxml=test-results/junit.xml
        # conftest.py 顶部已强制 USE_MOCK_LLM=true / LLM_BASE_URL="" 等隔离，
        # 本步骤不需要任何外部环境变量，保证确定性。

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: warn

  # ── 前端：类型检查 + 生产构建 ─────────────────────────────────────────────
  frontend-build:
    name: Frontend typecheck & build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # ── Docker：验证镜像可构建 ────────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        run: docker build -f backend/Dockerfile -t langgraph-agent:ci .

  # ── 真实 LLM 端到端验证（可选）────────────────────────────────────────────
  # 触发条件：手动触发且勾选 run_live_e2e，或 push master 且已配置 LLM_API_KEY
  live-e2e:
    name: Live E2E (real LLM)
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 15
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_live_e2e) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' &&
       (secrets.LLM_API_KEY != '' || secrets.DASHSCOPE_API_KEY != ''))
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      llm_base_url: ${{ secrets.LLM_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      llm_model: ${{ secrets.LLM_MODEL || 'qwen3.6-plus' }}
      use_mock_llm: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^mcp' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      - name: Run live E2E
        run: |
          export LLM_API_KEY="${LLM_API_KEY:-$DASHSCOPE_API_KEY}"
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::LLM_API_KEY is empty — configure the secret or skip live-e2e."
            exit 1
          fi
          python scripts/live_e2e.py
