# ─────────────────────────────────────────────────────────────────────────────
# CI workflow for langgraph-agent
#
# 触发：push / PR 到 master；workflow_dispatch 手动。
#       docs/ 与根级 *.md 的变更不触发——唯一例外是 docs/architecture.md：§3.4 事件表
#       是 `npm run check:sse` 的权威源，改本表的 PR 会触发全套 CI（#103）。
# 内容：
#   （2026-10-14：原 guard-protected-files 守卫已随 ADR 0008 删除——冻结区随确认闸门一并解除）
#   backend-test    Python 3.11 + ruff lint + mypy 类型闸（配置见 pyproject.toml）
#                   + pytest 离线全量回归（backend/tests/，计数以实跑为准、不写进注释）
#   backend-windows-smoke  windows-latest，只跑 Windows 敏感面的测试文件（清单见该 job 注释）
#   frontend-build  npm ci + tsc 类型检查 + SSE 事件词汇表断言（#92）+ vite 生产构建（产物上传为 artifact）
#
# 硬约束遵循 AGENTS.md：
#   - mcp 依赖用 --no-deps 单独安装，避免升级 uvicorn/starlette
#   - 离线测试由 backend/tests/conftest.py 顶部环境变量隔离，无需 .env
#   - LLM key 只走 secrets 注入，绝不硬编码/打印
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
    # 这里是 paths 白名单、不是 paths-ignore：`!` 写进 paths-ignore 不生效（ignore 只排除、
    # 不放行，见 GitHub 官方口径与 #103 的复核）。顺序敏感——`**` 全收 → 排掉 docs/ 与根级
    # *.md → 末尾那条正模式再把 docs/architecture.md（§3.4 事件表，check:sse 的权威源）收回来，
    # 于是改这张表的 PR 当次就跑 frontend job：表与代码真漂了才当次变红，不再红在下一张
    # 不相干的前端 PR 上（#103）。删末尾项前先读该票。
    paths: ["**", "!docs/**", "!*.md", "docs/architecture.md"]
  pull_request:
    branches: [master]
    # 与 push 的 paths 逐字一致：两侧各自独立求值，只改一侧会让另一侧继续漏检
    paths: ["**", "!docs/**", "!*.md", "docs/architecture.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 后端：离线全量回归 ────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # mcp 必须 --no-deps 安装，防止其拉高 uvicorn/starlette 版本（AGENTS.md 硬约束）
          grep -vE '^mcp' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      # 质量门禁工具链单独一份 requirements-dev.txt：运行期依赖
      # （requirements.txt）不该为 linter 变大。版本钉死，理由见该文件。
      - name: Install quality-gate toolchain
        run: pip install -r requirements-dev.txt

      # ruff / mypy 的规则集与排除面全部写在 pyproject.toml（含每条「刻意不启用」
      # 的理由）。基线要求全净：这两步一旦变红，就是新代码带进来的，不是历史债。
      # mypy 不传路径：files=["backend"] 由配置文件给出，生产与测试同一把闸。
      - name: Lint (ruff)
        run: python -m ruff check backend scripts

      - name: Typecheck (mypy)
        run: python -m mypy

      - name: Run offline test suite
        run: |
          python -m pytest backend/tests/ -q --durations=10 \
            --junitxml=test-results/junit.xml
        # conftest.py 顶部已强制 USE_MOCK_LLM=true / LLM_BASE_URL="" 等隔离，
        # 本步骤不需要任何外部环境变量，保证确定性。

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: warn

  # ── 后端：Windows 冒烟（静态挂载 / 路径 / 工作区文件面） ──────────────────
  # 为什么不是全量：Linux 全量已覆盖与 OS 无关的逻辑；这里只补「Linux 上根本跑不到」的面。
  # 清单按「Windows 敏感面」维护——改 os.name / sys.platform / 路径分隔符时，
  # 把对应测试文件加进下面的 pytest 命令行（同步 AGENTS.md「验证入口」的同一条命令）。
  # 进程树 / 子进程类默认不入清单（Windows runner 稳定性无数据）；B1 起按票逐个纳入
  # 并连跑观察——B1 第一个实验文件是 test_workspace_files_api.py。
  #   test_static_guard.py           路径判据（UNC / 盘符 / NUL / Windows 反斜杠形态）
  #   test_static_frontend.py        StaticFiles 挂载 e2e（Windows 上 get_path 用 \ 连接）
  #   test_gitignore_visibility.py   Windows-only 反斜杠 glob 用例（Linux 上被 skip）
  #   test_workspace_files_api.py    workspace 文件面（junction 逃逸 / 循环 / 预览截断；B1 首个实验文件）
  # 回归锚：PR #195 的 Windows 白屏（Vite assets 全 404）在 ubuntu-only CI 下是绿的。
  backend-windows-smoke:
    name: Backend Windows smoke (static mount / paths)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 与 backend-test 的 `grep -vE '^mcp'` 等价，但用 pwsh 原生过滤（Windows 上不依赖
      # Git Bash）；mcp 仍 --no-deps，防止其元数据把 uvicorn/starlette 拉出本仓区间。
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^mcp' } | Set-Content -Encoding utf8 requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      - name: Run Windows-sensitive tests
        run: >
          python -m pytest
          backend/tests/test_static_guard.py
          backend/tests/test_static_frontend.py
          backend/tests/test_gitignore_visibility.py
          backend/tests/test_workspace_files_api.py
          -q

  # ── 前端：类型检查 + 生产构建 ─────────────────────────────────────────────
  frontend-build:
    name: Frontend typecheck & build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # #92：SSE 事件词汇表防漂移。EventSource 只派发注册过的类型，漂了不报错、
      # 只是前端静默收不到，所以拿后端发布点 / §3.4 表 / 前端两处注册表逐条比一次。
      - name: SSE event registry drift check
        run: npm run check:sse

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
