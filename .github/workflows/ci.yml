# ─────────────────────────────────────────────────────────────────────────────
# CI workflow for langgraph-agent
#
# 触发：push / PR 到 master（docs/ 与 *.md 变更不触发）；workflow_dispatch 手动
# 内容：
#   guard-protected-files  受保护文件守卫（resilience.py/registry.py，[OVERRIDE] 逃生舱）
#   backend-test    Python 3.11 + pytest 离线全量回归（backend/tests/，351 用例）
#                   + live_e2e.py --check 离线冒烟（无 Key/无网络）
#   frontend-build  npm ci + tsc 类型检查 + vite 生产构建（产物上传为 artifact）
#   docker-build    验证 backend/Dockerfile 可构建（不 push）
#   live-e2e        真实 LLM 端到端验证（可选，需配置 LLM_API_KEY secret，默认仅手动触发）
#
# 硬约束遵循 AGENTS.md：
#   - mcp 依赖用 --no-deps 单独安装，避免升级 uvicorn/starlette
#   - 离线测试由 backend/tests/conftest.py 顶部环境变量隔离，无需 .env
#   - LLM key 只走 secrets 注入，绝不硬编码/打印
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: "运行真实 LLM 端到端验证（需配置 LLM_API_KEY secret）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 受保护文件守卫（AGENTS.md：熔断层零改动的 CI 机械化闸门）────────────
  guard-protected-files:
    name: Protected files guard (resilience/registry)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 保证 PR base sha 可 diff
      - name: Detect changes to protected files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          protected="backend/core/tools/resilience.py backend/core/tools/registry.py"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed=$(git diff --name-only "$base"...HEAD -- $protected)
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD -- $protected)
          else
            changed=""   # workflow_dispatch / 首次 push：无可比基线，放行
          fi
          if [ -z "$changed" ]; then
            echo "No protected-file changes."; exit 0
          fi
          echo "Changed protected files:"; echo "$changed"
          title="${PR_TITLE:-$(git log -1 --pretty=%s)}"
          case "$title" in *"[OVERRIDE]"*)
            echo "::warning::Protected files changed with [OVERRIDE] declared — allowing."; exit 0 ;;
          esac
          echo "::error::受保护文件被修改（AGENTS.md：熔断层零改动）。PR/commit 标题需包含 [OVERRIDE] 才能通过。"
          exit 1

  # ── 后端：离线全量回归 ────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # mcp 必须 --no-deps 安装，防止其拉高 uvicorn/starlette 版本（AGENTS.md 硬约束）
          grep -vE '^mcp' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      - name: Run offline test suite
        run: |
          python -m pytest backend/tests/ -q --durations=10 \
            --junitxml=test-results/junit.xml
        # conftest.py 顶部已强制 USE_MOCK_LLM=true / LLM_BASE_URL="" 等隔离，
        # 本步骤不需要任何外部环境变量，保证确定性。

      - name: Offline smoke of live_e2e wiring (--check)
        run: python scripts/live_e2e.py --check
        # 无网络、无 Key：只验证脚本依赖链可加载、配置可解析、内核可装配，
        # 可写路径全部重定向到临时目录，不碰 data/。

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: warn

  # ── 前端：类型检查 + 生产构建 ─────────────────────────────────────────────
  frontend-build:
    name: Frontend typecheck & build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # ── Docker：验证镜像可构建 ────────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        run: docker build -f backend/Dockerfile -t langgraph-agent:ci .

  # ── 真实 LLM 端到端验证（可选）────────────────────────────────────────────
  # 触发条件：手动触发且勾选 run_live_e2e，或 push master
  # 注意：job 级 if 中禁止引用 secrets 上下文（会导致整个 workflow 解析失败、
  #       所有 job 无法创建），因此密钥是否存在由 gate 步骤在运行期判断。
  live-e2e:
    name: Live E2E (real LLM)
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 15
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_live_e2e) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      llm_base_url: ${{ secrets.LLM_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      llm_model: ${{ secrets.LLM_MODEL || 'qwen3.6-plus' }}
      use_mock_llm: "false"
    steps:
      - name: Gate on API key availability
        id: gate
        run: |
          if [ -n "${LLM_API_KEY:-}${DASHSCOPE_API_KEY:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          grep -vE '^mcp' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps "mcp>=1.2,<2.0"

      - name: Run live E2E
        if: steps.gate.outputs.run == 'true'
        run: |
          export LLM_API_KEY="${LLM_API_KEY:-$DASHSCOPE_API_KEY}"
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::LLM_API_KEY is empty — configure the secret or skip live-e2e."
            exit 1
          fi
          python scripts/live_e2e.py

      - name: Report missing key on explicit dispatch
        if: steps.gate.outputs.run != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::已勾选运行 live E2E，但 LLM_API_KEY / DASHSCOPE_API_KEY secret 均未配置。"
          exit 1
