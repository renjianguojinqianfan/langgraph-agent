# ─────────────────────────────────────────────────────────────────────────────
# 提交前钩子（#114）：把文档纪律变成机械门。
#
# 为什么是 pre-commit 框架而不是 Husky（setup-pre-commit 技能原样是 Husky +
# lint-staged + Prettier，这里按本仓库现实改造，偏离理由）：
#   1. 根目录没有 package.json（唯一的在 frontend/），Python 侧才是主战场——
#      Husky 装不整齐，lint-staged 也管不到 .py；
#   2. Prettier 不在本仓闸门里（pyproject 的 ruff select 无 format，格式化从来
#      不是闸门），配了等于把全部存量文件重排成噪声 diff。hook 只跑检查、
#      不改文件——与 CI 同口径。
#
# Python 侧钩子一律 language: system + 仓库相对的 `.venv314` 解释器：配置里零版本号，
# ruff/mypy 仍只钉在 requirements-dev.txt 一处（该文件「抬版走人评估」红线
# 不变）；相对 entry 没有「自动回退主检出」这回事——worktree 是干净检出，
# 需自备 `.venv314`（可 junction 主检出）或回主检出跑门禁，与
# docs/agents/workflow.md「并行实施」节一致。另三个钩子（check:sse / frontend-tsc /
# frontend-tsc-config）走 node，
# 版本由 frontend/package.json 钉——「零第二版本源」的承诺只覆盖 Python 侧。
# 本机绝对路径不进公开仓库：entry 一律用仓库相对路径（安装说明见 README「质量门禁」）。
#
# 实测（2026-10-07 初测，2026-11-07 补 doc-links 与双 tsc；本机，供后人调档位参考）：
#   ruff ~1s · mypy 冷启 27s / 热 3s · check:sse 0.6s ·
#   tsc（tsconfig.json）~2.8s · tsc（tsconfig.node.json）~1.7s（--all-files，含钩子开销）·
#   doc-links ~0.6s（pre-commit 整体约 2.3s）· pytest 全量 93s——pytest 因此
#   不进钩子，由 CI backend-test 兜底。
#   docs-only 提交零钩子等待——唯一例外 docs/architecture.md：它是 SSE 事件面
#   四址之一（§3.4 表），刻意保留触发（该文件本也触发全套 CI）。
#   doc-links 只兜「改 tracked Markdown」这一面；CI paths 白名单不因此变化——
#   纯 docs 变更按仓库惯例可直推，靠这个钩子而不是 CI 兜底（#261 D-20）。
#
# 逃生门：SKIP=<hook-id> 跳单个钩子；git commit --no-verify 全跳。
# 技术开口不等于无记录——跳了要在 PR / 提交说明里写清为什么（[OVERRIDE] 文化）。
#
# 安装（每台机器一次；default_install_hook_types 已含 commit-msg）：
#   .venv314\Scripts\python.exe -m pre_commit install
# 手动全量：
#   .venv314\Scripts\python.exe -m pre_commit run --all-files
# ─────────────────────────────────────────────────────────────────────────────

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check（暂存 .py；与 CI 同命令）
        entry: .venv314/Scripts/python.exe -m ruff check
        language: system
        types_or: [python]
        pass_filenames: true
        require_serial: true

      - id: mypy
        name: mypy（暂存触及 backend/ 时全量；files=backend）
        entry: .venv314/Scripts/python.exe -m mypy
        language: system
        files: ^backend/
        pass_filenames: false

      - id: design-token-mirror
        name: 设计 token 镜像（DESIGN.md frontmatter ↔ index.css @theme；#261）
        entry: .venv314/Scripts/python.exe scripts/check_design_tokens.py
        language: system
        files: ^(DESIGN\.md|frontend/src/index\.css|scripts/check_design_tokens\.py|backend/tests/test_design_token_mirror\.py)$
        pass_filenames: false

      - id: doc-links
        name: 文档链接（tracked Markdown 相对链接；只跑检查不改文件）
        entry: .venv314/Scripts/python.exe scripts/check_doc_links.py
        language: system
        files: ^(docs/.*\.md|[^/]*\.md)$
        pass_filenames: false

      - id: sse-event-gate
        name: SSE 事件词汇表四址对齐（#92 的机械门；npm 包装在 git-bash 不可靠，直调同一脚本）
        entry: node frontend/scripts/check-sse-event-registry.mjs
        language: system
        files: ^(backend/.*\.py|frontend/src/hooks/useSSE\.ts|frontend/src/types/index\.ts|frontend/src/lib/eventLabels\.ts|docs/architecture\.md)$
        pass_filenames: false

      # frontend/scripts/*.mjs 是纯 JS，不在 tsc 项目面（tsconfig 不改），故不纳入。
      - id: frontend-tsc
        name: 前端 tsc（暂存含 frontend ts/tsx；与 CI frontend-build 同命令）
        entry: node frontend/node_modules/typescript/bin/tsc --noEmit -p frontend/tsconfig.json
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-tsc-config
        name: 前端 tsc（node 配置项目：vite/vitest config；与 CI typecheck 同口径）
        entry: node frontend/node_modules/typescript/bin/tsc --noEmit -p frontend/tsconfig.node.json
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: commit-msg-format
        name: commit-msg 校验（前缀 / 长度阻断 + 票号提醒）
        entry: .venv314/Scripts/python.exe scripts/validate_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
